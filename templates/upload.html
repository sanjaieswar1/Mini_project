{% extends "base.html" %}
{% block title %}Upload Dataset{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h4 class="mb-3"><i class="fa-solid fa-upload"></i> Upload Dataset</h4>
        <p class="text-muted">Supported formats: CSV, XLSX, XLS</p>
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <input class="form-control" type="file" name="dataset" accept=".csv,.xlsx,.xls" required>
          </div>
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload &amp; Analyze
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
